<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アド・チェイス：大逃走サバイバル</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* HUD（ヘッドアップディスプレイ） */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-sizing: border-box;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .cyber-panel {
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            text-shadow: 0 0 5px #ff0055;
        }

        /* 広告強制ポップアップ（ミッション画面） */
        #ad-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: auto;
        }

        .ad-box {
            background: linear-gradient(135deg, #ff0055, #ffaa00);
            border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.9);
            border-radius: 12px;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            color: #000;
            text-align: center;
            position: relative;
        }

        .ad-box h2 {
            margin-top: 0;
            color: #fff;
            text-shadow: 0 0 5px #000;
            font-size: 20px;
        }

        .ad-box p {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #111;
        }

        .ad-btn {
            background: #ffff00;
            border: 3px solid #000;
            color: #000;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 0 #886600;
            -webkit-tap-highlight-color: transparent;
        }
        .ad-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #886600; }

        /* スマホ用バーチャルパッド */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 20;
        }

        .virtual-pad {
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            touch-action: none;
        }

        .virtual-stick {
            width: 55px;
            height: 55px;
            background: rgba(255, 0, 85, 0.8);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            transition: transform 0.05s linear;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 5, 15, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: auto;
        }

        h1 { margin: 0 0 10px 0; color: #ff0055; font-size: 24px; text-shadow: 0 0 15px rgba(255,0,85,0.7); }
        p { margin: 10px 0 25px 0; color: #aaccff; font-size: 13px; line-height: 1.6; max-width: 600px; }

        .btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255,0,85,0.6);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { background: #ff3377; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="cyber-panel">
                <div id="lives">広告被弾数: 0 / 3回</div>
                <div id="survive-timer" style="margin-top: 4px; color: #00ffcc;">生存タイム: 0.00秒</div>
            </div>
            <div class="cyber-panel" id="controls-hint">
                [W,A,S,D] 移動 ｜ [マウスドラッグ or 右側スワイプ] 視点変更
            </div>
        </div>
    </div>

    <!-- 広告強制ポップアップ（解除ミッション） -->
    <div id="ad-modal">
        <div class="ad-box">
            <div style="background:#000; color:#fff; padding:4px 8px; font-size:10px; margin-bottom:10px; font-weight:bold; display:flex; justify-content:space-between;">
                <span>⚠️ TRAPPED BY ADVERTISEMENT</span><span>[PR]</span>
            </div>
            <h2 id="ad-title">怪しい副業への参加</h2>
            <p id="ad-desc">広告に捕まりました！ボタン連打で広告を振り払え！（3回タップ）</p>
            <div id="ad-progress" style="margin: 10px 0; font-family: monospace; font-weight: bold; color: #fff; text-shadow:0 0 3px #000;">残り連打数: 3回</div>
            <button class="ad-btn" id="ad-action-btn" onclick="handleAdMissionAction()">広告を連打して閉じる！</button>
        </div>
    </div>

    <!-- スマホ用バーチャルパッド -->
    <div id="mobile-controls">
        <div id="joy-pad" class="virtual-pad">
            <div id="joy-stick" class="virtual-stick"></div>
        </div>
    </div>

    <div id="overlay">
        <h1>アド・チェイス：大逃走サバイバル</h1>
        <p>【ルール】<br>
           広大なサイバー都市を舞台に、あなたをめがけて追尾してくる**「リアルなバナー広告」**から逃げ切れ！<br>
           主人公の移動速度を超特急（45.0）に引き上げました！軽快に走り回って広告を圧倒しよう！<br>
           **合計3回捕まえるとゲームオーバーです！**</p>
        <button class="btn" onclick="startGame()">逃走開始</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let gameActive = false;
        let hitCount = 0; 
        let surviveTime = 0;
        let startTime = 0;
        let animationFrameId = null;

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const PI_2 = Math.PI / 2;

        let chasingAds = [];
        let missionCounter = 0;
        let activeAdIndex = null;

        // 広告テクスチャの生成
        const adImageUrls = [
            generateAdCanvas("【PR】今すぐ月収300万円！", "怪しい副業への第一歩", "#ff0055", 3),
            generateAdCanvas("【警告】ウイルス感染検出", "今すぐスキャンボタンを押せ", "#ffcc00", 4),
            generateAdCanvas("出会い系：近くに美少女！", "無料で今すぐチャット開始", "#00f0ff", 3),
            generateAdCanvas("絶対に閉じるボタンが小さい詐欺", "プレミアム会員へ強制登録", "#9900ff", 5),
            generateAdCanvas("3秒でハゲが治る謎のサプリ", "今だけ90%OFFで大セール", "#00ff66", 3)
        ];

        function generateAdCanvas(title, sub, bgColor, count) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#000000';
            ctx.fillRect(20, 20, 140, 30);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('MANDATORY AD', 30, 40);

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText(title, 20, 95);

            ctx.fillStyle = '#222222';
            ctx.font = '18px sans-serif';
            ctx.fillText(sub, 20, 135);

            ctx.fillStyle = '#ffff00';
            ctx.fillRect(20, 165, 220, 55);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('解除ミッションあり', 30, 201);

            return { canvas, count, title, sub };
        }

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x02050e);
            scene.fog = new THREE.FogExp2(0x02050e, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            buildOpenWorldCity();
            window.addEventListener('resize', onWindowResize);
            setupInput();
        }

        function buildOpenWorldCity() {
            // 広大な床（150m x 150m）
            const floorGeo = new THREE.PlaneGeometry(150, 150);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a14, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // ビル群
            for (let i = 0; i < 25; i++) {
                let w = 6 + Math.random() * 8;
                let h = 10 + Math.random() * 20;
                let d = 6 + Math.random() * 8;
                let bGeo = new THREE.BoxGeometry(w, h, d);
                let bMat = new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.7 });
                let building = new THREE.Mesh(bGeo, bMat);

                let x = (Math.random() - 0.5) * 120;
                let z = (Math.random() - 0.5) * 120;
                if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;

                building.position.set(x, h / 2, z);
                scene.add(building);
            }
        }

        function spawnChasingAds() {
            chasingAds.forEach(a => scene.remove(a.mesh));
            chasingAds = [];

            for (let i = 0; i < 4; i++) {
                let angle = (i / 4) * Math.PI * 2;
                let dist = 28; 
                let xPos = Math.cos(angle) * dist;
                let zPos = Math.sin(angle) * dist;
                let yPos = 1.7;

                let adInfo = adImageUrls[Math.floor(Math.random() * adImageUrls.length)];
                let texture = new THREE.CanvasTexture(adInfo.canvas);
                let adGeo = new THREE.PlaneGeometry(4, 2.4);
                let adMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                let adMesh = new THREE.Mesh(adGeo, adMat);
                adMesh.position.set(xPos, yPos, zPos);
                scene.add(adMesh);

                chasingAds.push({
                    mesh: adMesh,
                    speed: 2.2 + Math.random() * 0.6,
                    info: adInfo
                });
            }
        }

        function setupInput() {
            // キーボード操作
            document.addEventListener('keydown', (e) => {
                if (!gameActive) return;
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
            });

            // PCマウス視点（ドラッグ操作）
            let isMouseDown = false;
            let lastMouseX = 0, lastMouseY = 0;

            document.addEventListener('mousedown', (e) => {
                if (!gameActive) return;
                isMouseDown = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            document.addEventListener('mousemove', (e) => {
                if (!gameActive || !isMouseDown) return;
                let dx = e.clientX - lastMouseX;
                let dy = e.clientY - lastMouseY;
                euler.y -= dx * 0.003;
                euler.x -= dy * 0.003;
                euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
                camera.quaternion.setFromEuler(euler);
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            document.addEventListener('mouseup', () => { isMouseDown = false; });

            // スマホ用バーチャルパッド
            const joyPad = document.getElementById('joy-pad');
            const joyStick = document.getElementById('joy-stick');
            let joyTouchId = null;
            let joyCenter = { x: 0, y: 0 };

            joyPad.addEventListener('pointerdown', (e) => {
                joyTouchId = e.pointerId;
                const rect = joyPad.getBoundingClientRect();
                joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                joyPad.setPointerCapture(e.pointerId);
                updateJoy(e.clientX, e.clientY);
            });

            joyPad.addEventListener('pointermove', (e) => {
                if (e.pointerId !== joyTouchId) return;
                updateJoy(e.clientX, e.clientY);
            });

            const resetJoy = (e) => {
                if (e.pointerId === joyTouchId) {
                    joyTouchId = null;
                    moveForward = moveBackward = moveLeft = moveRight = false;
                    joyStick.style.transform = `translate(0px, 0px)`;
                }
            };
            joyPad.addEventListener('pointerup', resetJoy);
            joyPad.addEventListener('pointercancel', resetJoy);

            function updateJoy(cx, cy) {
                let dx = cx - joyCenter.x;
                let dy = cy - joyCenter.y;
                let dist = Math.hypot(dx, dy);
                let maxDist = 40;
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
                moveForward = dy < -10;
                moveBackward = dy > 10;
                moveLeft = dx < -10;
                moveRight = dx > 10;
            }

            // スマホ画面右側スワイプ視点
            let lookTouchId = null;
            let lastX = 0, lastY = 0;
            document.addEventListener('pointerdown', (e) => {
                if (!gameActive || e.clientX < window.innerWidth / 2 || e.target.closest('#ad-modal')) return;
                lookTouchId = e.pointerId;
                lastX = e.clientX;
                lastY = e.clientY;
            });
            document.addEventListener('pointermove', (e) => {
                if (e.pointerId !== lookTouchId || !gameActive) return;
                let dx = e.clientX - lastX;
                let dy = e.clientY - lastY;
                euler.y -= dx * 0.005;
                euler.x -= dy * 0.005;
                euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
                camera.quaternion.setFromEuler(euler);
                lastX = e.clientX;
                lastY = e.clientY;
            });
            const endLook = (e) => { if (e.pointerId === lookTouchId) lookTouchId = null; };
            document.addEventListener('pointerup', endLook);
            document.addEventListener('pointercancel', endLook);
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            gameActive = true;
            hitCount = 0;
            startTime = performance.now();
            prevTime = performance.now();
            camera.position.set(0, 1.7, 0);
            euler.set(0, 0, 0);

            moveForward = moveBackward = moveLeft = moveRight = false;

            spawnChasingAds();
            updateHUD();
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animate();
        }

        function updateHUD() {
            document.getElementById('lives').innerText = `広告被弾数: ${hitCount} / 3回`;
        }

        function triggerAdMission(adIndex) {
            gameActive = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            activeAdIndex = adIndex;
            let ad = chasingAds[adIndex];
            missionCounter = ad.info.count;

            document.getElementById('ad-title').innerText = ad.info.title;
            document.getElementById('ad-desc').innerText = `広告に捕まりました！「${ad.info.sub}」を解除するためボタンを連打してください！`;
            document.getElementById('ad-progress').innerText = `残り連打数: ${missionCounter}回`;
            document.getElementById('ad-modal').style.display = 'flex';
        }

        function handleAdMissionAction() {
            missionCounter--;
            document.getElementById('ad-progress').innerText = `残り連打数: ${missionCounter}回`;

            if (missionCounter <= 0) {
                document.getElementById('ad-modal').style.display = 'none';
                hitCount++;
                updateHUD();

                let angle = Math.random() * Math.PI * 2;
                chasingAds[activeAdIndex].mesh.position.x = camera.position.x + Math.cos(angle) * 35;
                chasingAds[activeAdIndex].mesh.position.z = camera.position.z + Math.sin(angle) * 35;

                if (hitCount >= 3) {
                    gameOver();
                } else {
                    gameActive = true;
                    prevTime = performance.now();
                    animate();
                }
            }
        }

        function gameOver() {
            gameActive = false;
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <h1 style="color:#ff3333;">💥 広告に3回捕まりました！ 💥</h1>
                <p>広大な街中を逃げ回りましたが、執拗な広告の連打地獄に追いつかれてしまいました……。<br>生存タイム: ${surviveTime.toFixed(2)}秒</p>
                <button class="btn" onclick="startGame()">もう一度挑戦する</button>
            `;
        }

        function animate() {
            if (!gameActive) return;
            animationFrameId = requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            surviveTime = (time - startTime) / 1000;
            document.getElementById('survive-timer').innerText = `生存タイム: ${surviveTime.toFixed(2)}秒`;

            // プレイヤーの移動処理
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            // 【調整】主人公の移動速度を超特急に大幅アップ（26.0 → 45.0）
            if (moveForward || moveBackward) velocity.z -= direction.z * 45.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 45.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(-velocity.z * delta);

            // マップの境界制限（150m四方）
            camera.position.x = Math.max(-70, Math.min(70, camera.position.x));
            camera.position.z = Math.max(-70, Math.min(70, camera.position.z));

            // 広告がプレイヤーを追跡
            for (let i = 0; i < chasingAds.length; i++) {
                let ad = chasingAds[i];
                let adPos = ad.mesh.position;

                let dirX = camera.position.x - adPos.x;
                let dirZ = camera.position.z - adPos.z;
                let dist = Math.hypot(dirX, dirZ);

                if (dist > 0.1) {
                    adPos.x += (dirX / dist) * ad.speed * delta;
                    adPos.z += (dirZ / dist) * ad.speed * delta;
                }

                ad.mesh.lookAt(camera.position.x, adPos.y, camera.position.z);

                // 接触判定
                if (dist < 1.8) {
                    triggerAdMission(i);
                    return;
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
